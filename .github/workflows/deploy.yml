name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Inject secrets
        run: cp ~/docker/DevTools/.env .env

      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — rebuilding everything"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(backend/|docker-compose\.yml)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(frontend/|docker-compose\.yml)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend
        if: steps.changes.outputs.backend == 'true'
        run: docker compose build backend

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        run: docker compose build frontend

      - name: Deploy
        run: docker compose up -d --remove-orphans

      - name: Prune unused images
        run: docker image prune -f

      - name: Health check
        run: |
          set -a
          eval "$(grep -v '^#' .env | sed 's/=\(.*\)/="\1"/')"
          set +a
          BACKEND_PORT="${PORT:-5039}"
          FRONT_PORT="${FRONTEND_PORT:-3004}"
          echo "Waiting for services to start..."
          for i in $(seq 1 30); do
            HTTP_BE=$(curl -s -o /dev/null --max-time 5 -w "%{http_code}" "http://localhost:$BACKEND_PORT/api/health" 2>/dev/null || true)
            HTTP_FE=$(curl -s -o /dev/null --max-time 5 -w "%{http_code}" "http://localhost:$FRONT_PORT/" 2>/dev/null || true)
            echo "Attempt $i — backend: $HTTP_BE, frontend: $HTTP_FE"
            if echo "$HTTP_BE" | grep -qE '^200$' && echo "$HTTP_FE" | grep -qE '^(200|307)$'; then
              echo "Deployment successful!"
              exit 0
            fi
            sleep 5
          done
          echo "Health check timed out after 150s"
          exit 1
