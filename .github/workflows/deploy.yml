name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Inject secrets
        run: cp ~/docker/DevTools/.env .env

      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — rebuilding everything"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(backend/|docker-compose\.yml)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(frontend/|docker-compose\.yml)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend
        if: steps.changes.outputs.backend == 'true'
        run: docker compose build backend

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        run: docker compose build frontend

      - name: Deploy
        run: docker compose up -d --remove-orphans

      - name: Prune unused images
        run: docker image prune -f

      - name: Health check
        run: |
          set -a
          eval "$(grep -v '^#' .env | sed 's/=\(.*\)/="\1"/')"
          set +a
          BACKEND_PORT="${PORT:-5039}"
          FRONT_PORT="${FRONTEND_PORT:-3004}"
          for i in 1 2 3 4 5; do
            sleep 5
            BE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://localhost:$BACKEND_PORT/api/health" 2>/dev/null || true)
            FE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://localhost:$FRONT_PORT/" 2>/dev/null || true)
            echo "Attempt $i — backend: $BE, frontend: $FE"
            [ "$BE" = "200" ] && echo "$FE" | grep -qE '^(200|307)$' && echo "Deployment successful!" && exit 0
          done
          echo "Health check failed"; exit 1
